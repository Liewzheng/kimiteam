name: kimiteam build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build Kimi Code CJS bundle
        run: pnpm -C apps/kimi-code run build:native:js

      - name: Build Kimi Web (fork dist-web)
        run: pnpm -C apps/kimi-web run build

      - name: Copy web assets into kimi-code
        run: node apps/kimi-code/scripts/copy-web-assets.mjs

      - name: Package dist-web.zip
        run: |
          cd apps/kimi-code/dist-web
          # The repo root is ../../../ from apps/kimi-code/dist-web. The zip and
          # its .sha256 must land at the repo root because the staging step
          # copies them unqualified (cp dist-web.zip) from the root; the previous
          # off-by-one (../../) placed them under apps/ and made staging fail.
          zip -qr ../../../dist-web.zip index.html boot.js favicon.ico assets -x '*.DS_Store'
          cd ../../..
          sha256sum dist-web.zip | tee dist-web.zip.sha256

      - name: Compute sha256
        run: |
          sha256sum apps/kimi-code/dist-native/intermediates/main.cjs \
            | tee apps/kimi-code/dist-native/intermediates/main-team.cjs.sha256

      - name: Ensure kimiteam-dev release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create kimiteam-dev \
            --title "kimiteam-dev" \
            --notes "Rolling dev build of kimiteam (main-team.cjs + dist-web.zip). Updated on every push to main." \
            --latest=false \
            --prerelease 2>/dev/null || true

      - name: Stage assets for upload
        run: |
          mkdir -p dist-kimiteam
          cp apps/kimi-code/dist-native/intermediates/main.cjs \
             dist-kimiteam/main-team.cjs
          cp apps/kimi-code/dist-native/intermediates/main-team.cjs.sha256 \
             dist-kimiteam/
          cp dist-web.zip \
             dist-kimiteam/dist-web.zip
          cp dist-web.zip.sha256 \
             dist-kimiteam/dist-web.zip.sha256

      - name: Upload bundle asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload kimiteam-dev \
            dist-kimiteam/main-team.cjs \
            dist-kimiteam/main-team.cjs.sha256 \
            dist-kimiteam/dist-web.zip \
            dist-kimiteam/dist-web.zip.sha256 \
            --clobber
